<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena Portal – Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar">
  <h2>Arena <span>Admin</span></h2>
  <button class="ghost" style="color:#fff;border-color:#fff" onclick="logout()">Log out</button>
</header>
<main class="layout">
  <section class="panel">
    <h2>Create tournament</h2>
    <form id="tForm">
      <label for="t_name">Tournament name</label><input id="t_name" required>
      <label for="t_game">Game</label>
      <select id="t_game"><option>Valorant</option><option>BGMI</option><option>Free Fire</option><option>FIFA</option></select>
      <label for="t_date">Date</label><input id="t_date" type="date" required>
      <label for="t_slots">Total slots</label><input id="t_slots" type="number" min="2" required>
      <label for="t_prize">Prize pool (₹)</label><input id="t_prize" type="number" min="0" required>
      <button type="submit">Create tournament</button>
    </form>
  </section>
  <section>
    <div class="panel" style="margin-bottom:1.5rem"><h2>Tournaments</h2><div id="list" class="grid"></div></div>
    <!-- TODO (full version): registered-players table, edit tournament, match results -->
  </section>
</main>
<script src="js/common.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
